# Render Blueprint (infrastructure as code, Technical Design §10.2).
# Render: New -> Blueprint -> this repository. Values with `sync: false` are asked for once
# in the Render dashboard and never stored in Git.
# Sprint 2 adds fitplan-session, Sprint 3 adds fitplan-audit.

envVarGroups:
  - name: fitplan-internal
    envVars:
      # shared secret between the gateway and the services, generated by Render
      - key: INTERNAL_KEY
        generateValue: true

services:
  - type: web
    name: fitplan-gateway
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci
    startCommand: npm start -w @fitplan/gateway
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - services/gateway/**
        - packages/shared/**
        - package-lock.json
    envVars:
      - fromGroup: fitplan-internal
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        value: 681825537541-k59rl0dr5lj7egl075h0kekaun7n683k.apps.googleusercontent.com
      - key: CORS_ORIGIN
        value: https://fitplan-uu.vercel.app
      - key: ROUTINE_URL
        value: https://fitplan-routine.onrender.com

  - type: web
    name: fitplan-routine
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci
    startCommand: npm start -w @fitplan/routine
    healthCheckPath: /health
    buildFilter:
      paths:
        - services/routine/**
        - packages/shared/**
        - package-lock.json
    envVars:
      - fromGroup: fitplan-internal
      - key: MONGODB_URI
        sync: false
